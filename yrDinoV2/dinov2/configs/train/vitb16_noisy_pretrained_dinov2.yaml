# this corresponds to the default config
MODEL:
  PRETRAINED: 'checkpoints/dinov2_vitb14_pretrain.pth'
train:
  batch_size_per_gpu: 128
  saveckp_freq: 1
crops:
  global_crops_size: 256
optim:
  epochs: 200
student:
  arch: vit_base
  block_chunks: 0
  diffusion_mode: true
  drop_path_rate: 0.0
evaluation:
  eval_period_iterations: 1000
compute_precision:
  grad_scaler: false
  teacher:
    backbone:
      sharding_strategy: NO_SHARD
      mixed_precision:
        param_dtype: bf16
        reduce_dtype: bf16
        buffer_dtype: fp32
    dino_head:
      sharding_strategy: NO_SHARD
      mixed_precision:
        param_dtype: bf16
        reduce_dtype: bf16
        buffer_dtype: fp32
    ibot_head:
      sharding_strategy: NO_SHARD
      mixed_precision:
        param_dtype: bf16
        reduce_dtype: bf16
        buffer_dtype: fp32
  student:
    backbone:
      sharding_strategy: NO_SHARD
      mixed_precision:
        param_dtype: bf16
        reduce_dtype: bf16
        buffer_dtype: fp32
    dino_head:
      sharding_strategy: NO_SHARD
      mixed_precision:
        param_dtype: bf16
        reduce_dtype: fp32
        buffer_dtype: fp32
    ibot_head:
      sharding_strategy: NO_SHARD
      mixed_precision:
        param_dtype: bf16
        reduce_dtype: fp32
        buffer_dtype: fp32